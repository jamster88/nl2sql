# The JavaFX toolkit is a non-daemon thread with implicit exit turned off, so
# nothing ends it when the last test does -- and a test JVM that will not exit
# is one the build kills with a signal and reports as a crash. `FxToolkit`
# registers an AutoCloseable against the root context to close it; this is what
# makes the store actually close it.
junit.jupiter.extensions.store.close.autocloseable.enabled = true
