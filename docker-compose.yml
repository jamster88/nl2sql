name: nl2sql

services:
  postgres:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GEN_ARGS: ${GEN_ARGS:-}
        DB_NAME: ${POSTGRES_DB:-nl2sql_retail}
        DB_USER: ${POSTGRES_USER:-nl2sql}
        DB_PASSWORD: ${POSTGRES_PASSWORD:-nl2sql}
        DB_READER: ${POSTGRES_READER_USER:-nl2sql_reader}
        DB_READER_PASSWORD: ${POSTGRES_READER_PASSWORD:-nl2sql_reader}
    image: ${IMAGE_NAME:-nl2sql-retail-postgres}:${IMAGE_TAG:-latest}
    container_name: nl2sql-postgres
    restart: unless-stopped
    shm_size: 256mb
    stop_grace_period: 1m
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Matches PGDATA in docker/Dockerfile. The image already ships a
      # populated cluster at this path; Docker seeds the named volume from it
      # the first time the volume is created, and the volume keeps any later
      # writes across stop/start/recreate.
      - pgdata:/var/lib/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nl2sql} -d ${POSTGRES_DB:-nl2sql_retail}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The RAG knowledge base: pgvector holding the embedded chunks of every
  # document in knowledge/, one collection per document. The image ships the
  # embeddings inside it, the same way the retail image ships its dataset.
  vectordb:
    image: ${VECTOR_IMAGE_NAME:-mcfaddja/nl2sql-rag-vectordb}:${VECTOR_IMAGE_TAG:-v3_1}
    container_name: nl2sql-vectordb
    restart: unless-stopped
    stop_grace_period: 1m
    ports:
      - "${VECTOR_DB_PORT:-5434}:5432"
    volumes:
      - vectordata:/var/lib/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${VECTOR_DB_USER:-ragproc} -d ${VECTOR_DB_NAME:-nl2sql_vectors}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The context store: the golden question/SQL pairs as rows, plus the BM25
  # statistics over their keywords. The agent's example retriever reads the rows
  # and runs the keyword half of its ensemble here; the matching vectors live in
  # vectordb above. Like that one, the image ships its data inside it.
  chunkdb:
    image: ${CONTEXT_IMAGE_NAME:-mcfaddja/nl2sql-rag-chunkdb}:${CONTEXT_IMAGE_TAG:-v3_1}
    container_name: nl2sql-chunkdb
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${CONTEXT_DB_USER:-ragproc}
      POSTGRES_PASSWORD: ${CONTEXT_DB_PASSWORD:-ragproc}
      POSTGRES_DB: ${CONTEXT_DB_NAME:-nl2sql_chunks}
    ports:
      - "${CONTEXT_DB_PORT:-5433}:5432"
    volumes:
      - chunkdata:/var/lib/pgdata
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CONTEXT_DB_USER:-ragproc} -d ${CONTEXT_DB_NAME:-nl2sql_chunks}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The feedback staging database: where a verdict from the web GUI waits
  # until someone has looked at it.
  #
  # A stock Postgres rather than one of this project's built images, and its
  # own service rather than a schema in one of the others, because what it
  # holds is a different kind of thing. The retail store is the subject under
  # test and writing curation data into it would pollute the thing being
  # measured; the chunk and vector stores ship their data inside published
  # images, so they are artefacts rather than places to keep something that
  # accumulates. This is ordinary runtime data written by strangers, and it
  # wants its own volume, its own backup story and its own blast radius.
  #
  # The schema and the INSERT-only writer role are created by the review
  # service on every start, so there is nothing to bake into an image -- see
  # review/nl2sql_review/store.py.
  feedbackdb:
    image: ${FEEDBACK_IMAGE:-postgres:18}
    container_name: nl2sql-feedbackdb
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${FEEDBACK_DB_USER:-feedback}
      POSTGRES_PASSWORD: ${FEEDBACK_DB_PASSWORD:-feedback}
      POSTGRES_DB: ${FEEDBACK_DB_NAME:-nl2sql_feedback}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${FEEDBACK_DB_PORT:-5435}:5432"
    volumes:
      - feedbackdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${FEEDBACK_DB_USER:-feedback} -d ${FEEDBACK_DB_NAME:-nl2sql_feedback}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["feedback"]

  # The corrections store: where a *wrong* answer goes once a reviewer has
  # written, and validated against the retail database, the SQL that should
  # have been generated. Its records -- the question, the incorrect answer,
  # the correct one -- and its RAG, an embedding of each question beside the
  # two queries, live side by side in one Postgres with pgvector.
  #
  # Its own service rather than a table in the golden set's stores, for the
  # reason the golden set exists at all: it is what the agent is measured
  # against, and a record of the agent's mistakes is not a benchmark answer.
  # A stock image like feedbackdb's: the review service creates the schema
  # on every start, so there is nothing to bake in.
  correctionsdb:
    image: ${FIXES_IMAGE:-pgvector/pgvector:pg18}
    container_name: nl2sql-correctionsdb
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${CORRECTIONS_DB_USER:-corrections}
      POSTGRES_PASSWORD: ${CORRECTIONS_DB_PASSWORD:-corrections}
      POSTGRES_DB: ${CORRECTIONS_DB_NAME:-nl2sql_corrections}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${CORRECTIONS_DB_PORT:-5436}:5432"
    volumes:
      - correctionsdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${CORRECTIONS_DB_USER:-corrections} -d ${CORRECTIONS_DB_NAME:-nl2sql_corrections}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["review"]

  # The completions store: the same, for an answer that was *correct but
  # incomplete* -- the SQL was right and the answer left out something a
  # reader needed. Its own database and RAG again, apart from the
  # corrections store as well as from the golden set: a missing label and a
  # wrong join are different lessons, and a later agent will want to ask
  # for one without being handed the other.
  completionsdb:
    image: ${FIXES_IMAGE:-pgvector/pgvector:pg18}
    container_name: nl2sql-completionsdb
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${COMPLETIONS_DB_USER:-completions}
      POSTGRES_PASSWORD: ${COMPLETIONS_DB_PASSWORD:-completions}
      POSTGRES_DB: ${COMPLETIONS_DB_NAME:-nl2sql_completions}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${COMPLETIONS_DB_PORT:-5437}:5432"
    volumes:
      - completionsdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${COMPLETIONS_DB_USER:-completions} -d ${COMPLETIONS_DB_NAME:-nl2sql_completions}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["review"]

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ${AGENT_IMAGE_NAME:-nl2sql-agent}:${AGENT_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      chunkdb:
        condition: service_healthy
    environment: &agent-environment
      # The read-only role, not the owner: the agent only ever SELECTs.
      # launch.sh / setup.sh create it on every start (docker/reader_role.sql).
      # Anchored because the SQL console below reads the same database as the
      # same role, and two copies of a URL are two chances for them to differ.
      DATABASE_URL: &agent-database-url postgresql+psycopg://${POSTGRES_READER_USER:-nl2sql_reader}:${POSTGRES_READER_PASSWORD:-nl2sql_reader}@postgres:5432/${POSTGRES_DB:-nl2sql_retail}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.10.82:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.8-256k}
      # 256k. Multi-shot puts the schema, the knowledge block and three
      # worked SQL examples in one window; Ollama truncates silently past
      # num_ctx, so it is set here rather than left to its own default.
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-262144}
      VECTOR_DB_URL: postgresql+psycopg://${VECTOR_DB_USER:-ragproc}:${VECTOR_DB_PASSWORD:-ragproc}@vectordb:5432/${VECTOR_DB_NAME:-nl2sql_vectors}
      CONTEXT_DB_URL: postgresql+psycopg://${CONTEXT_DB_USER:-ragproc}:${CONTEXT_DB_PASSWORD:-ragproc}@chunkdb:5432/${CONTEXT_DB_NAME:-nl2sql_chunks}
      # bge-m3 is usually served by the Ollama on the machine running Docker,
      # which is a different host than the one serving the chat model.
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_TOP_K: ${RAG_TOP_K:-4}
      EXAMPLES_ENABLED: ${EXAMPLES_ENABLED:-true}
      EXAMPLES_TOP_K: ${EXAMPLES_TOP_K:-3}
      # Replay the retrieved pairs as exemplar turns in front of the question.
      MULTI_SHOT_ENABLED: ${MULTI_SHOT_ENABLED:-true}
      EXAMPLES_RERANK: ${EXAMPLES_RERANK:-mmr}
      # --- v4 multi-agent pipeline ------------------------------------
      # Each stage the architecture makes optional is a flag, so an
      # ablation is an environment change rather than a code change
      # (arch4 section 11).
      SUPERVISOR_ENABLED: ${SUPERVISOR_ENABLED:-true}
      LITERALS_ENABLED: ${LITERALS_ENABLED:-true}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      NARRATE_ENABLED: ${NARRATE_ENABLED:-true}
      # The arch5 Completeness Reviewer after execution, and its one
      # reflective model call (arch5 section 6.6).
      REVIEW_ENABLED: ${REVIEW_ENABLED:-true}
      REVIEW_REFLECTION_ENABLED: ${REVIEW_REFLECTION_ENABLED:-true}
      # "vector" is the Schema Retriever (DDL-chunk vectors + FK closure);
      # "llm" restores v3's table-selection model call for comparison.
      SCHEMA_RETRIEVAL: ${SCHEMA_RETRIEVAL:-vector}
      # One counter for every failure source: 7 generations, so one draft
      # and six repairs (arch5 section 6.4).
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-7}
      # Estimated-plan cost ceiling, calibrated against this dataset.
      MAX_PLAN_COST: &agent-max-plan-cost ${MAX_PLAN_COST:-1000000}
      # --- arch5.2 model routing ---------------------------------------
      # Each model call goes to the cheapest model the catalog shows is
      # suited to its task at the question's complexity; off is v5.1, every
      # call to OLLAMA_MODEL. The catalog is models/build_catalog.py's,
      # mounted read-only below; the path is inside the container.
      MODEL_ROUTING_ENABLED: ${MODEL_ROUTING_ENABLED:-true}
      MODEL_CATALOG: ${MODEL_CATALOG:-/app/models/catalog.json}
      # --- forwarded, not overridden ----------------------------------
      # Every remaining setting the agent reads, passed through empty so the
      # image's own default stands unless the host sets one. config.py reads
      # an empty value as unset for exactly this reason, which is what keeps
      # these from having to repeat -- and drift from -- their defaults.
      CLARIFY_ENABLED: ${CLARIFY_ENABLED:-}
      DB_SCHEMA: ${DB_SCHEMA:-}
      MAX_ROWS: ${MAX_ROWS:-}
      MAX_TABLES: ${MAX_TABLES:-}
      SCHEMA_TOP_K: ${SCHEMA_TOP_K:-}
      LITERAL_MAX_DISTINCT: ${LITERAL_MAX_DISTINCT:-}
      LITERAL_MIN_SCORE: ${LITERAL_MIN_SCORE:-}
      SAMPLE_ROWS: ${SAMPLE_ROWS:-}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-}
      OLLAMA_CONNECT_TIMEOUT: ${OLLAMA_CONNECT_TIMEOUT:-}
      OLLAMA_REASONING: ${OLLAMA_REASONING:-}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-}
      RAG_MAX_CONTEXT_CHARS: ${RAG_MAX_CONTEXT_CHARS:-}
      EXAMPLES_CANDIDATE_K: ${EXAMPLES_CANDIDATE_K:-}
      EXAMPLES_FUSION: ${EXAMPLES_FUSION:-}
      EXAMPLES_RRF_K: ${EXAMPLES_RRF_K:-}
      EXAMPLES_RERANK_K: ${EXAMPLES_RERANK_K:-}
      EXAMPLES_RERANK_LAMBDA: ${EXAMPLES_RERANK_LAMBDA:-}
      EXAMPLES_GROUNDING_WEIGHT: ${EXAMPLES_GROUNDING_WEIGHT:-}
      EXAMPLES_MAX_CONTEXT_CHARS: ${EXAMPLES_MAX_CONTEXT_CHARS:-}
      EXAMPLE_WEIGHT_QUESTION: ${EXAMPLE_WEIGHT_QUESTION:-}
      EXAMPLE_WEIGHT_KEYWORDS: ${EXAMPLE_WEIGHT_KEYWORDS:-}
      EXAMPLE_WEIGHT_REASONING: ${EXAMPLE_WEIGHT_REASONING:-}
      MAX_SQL_ATTEMPTS: ${MAX_SQL_ATTEMPTS:-}
      MODEL_ROUTE_ON_PRIOR: ${MODEL_ROUTE_ON_PRIOR:-}
      MODEL_ROUTE_SUPERVISOR: ${MODEL_ROUTE_SUPERVISOR:-}
      MODEL_ROUTE_GENERATOR: ${MODEL_ROUTE_GENERATOR:-}
      MODEL_ROUTE_REFLECTION: ${MODEL_ROUTE_REFLECTION:-}
      MODEL_ROUTE_NARRATOR: ${MODEL_ROUTE_NARRATOR:-}
      MODEL_ROUTE_REPAIR: ${MODEL_ROUTE_REPAIR:-}
      MODEL_MAX_LOADED: ${MODEL_MAX_LOADED:-}
      MODEL_NUM_CTX: ${MODEL_NUM_CTX:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      # --- tracing ----------------------------------------------------
      # setup.sh writes the mlflow service's address into .env; with it,
      # every run is traced whenever that service is up (--mlflow), and
      # runs untraced when it is not. Empty is off.
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-}
    # Docker Desktop resolves host.docker.internal on its own; this is what
    # makes the same EMBED_BASE_URL work on plain Linux Docker too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The model catalog (arch5.2), rebuilt on the host and read here.
      - ./models/catalog.json:/app/models/catalog.json:ro
    stdin_open: true
    tty: true
    # Not started by `up`; run on demand with `docker compose run --rm agent ...`
    profiles: ["agent"]

  # The same image as `agent`, started as a long-running HTTPS server instead
  # of a one-shot command. This is what a GUI talks to: JSON over TLS, an
  # OpenAPI document at /openapi.json, and Server-Sent progress events, so
  # the client can be TypeScript, Python, Java or curl without this
  # repository knowing which.
  #
  # `extends` is not used because compose merges `environment` maps: the
  # agent service's whole environment is repeated here through YAML anchors
  # below, which keeps one definition of what the pipeline is configured with.
  api:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ${AGENT_IMAGE_NAME:-nl2sql-agent}:${AGENT_IMAGE_TAG:-latest}
    container_name: nl2sql-api
    restart: unless-stopped
    command: ["python", "-m", "nl2sql_agent.api"]
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      chunkdb:
        condition: service_healthy
    environment:
      <<: *agent-environment
      # --- the socket ------------------------------------------------
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8443}
      API_ROOT_PATH: ${API_ROOT_PATH:-}
      # TLS is on by default and the certificate is written on first start
      # into the volume below. Set API_TLS_ALLOW_SELF_SIGNED=false once a
      # real certificate is mounted: the server then refuses to fall back
      # to the development one instead of quietly serving it.
      API_TLS_ENABLED: ${API_TLS_ENABLED:-true}
      API_TLS_CERT_FILE: ${API_TLS_CERT_FILE:-/etc/nl2sql/tls/server.crt}
      API_TLS_KEY_FILE: ${API_TLS_KEY_FILE:-/etc/nl2sql/tls/server.key}
      API_TLS_GENERATE: ${API_TLS_GENERATE:-true}
      API_TLS_ALLOW_SELF_SIGNED: ${API_TLS_ALLOW_SELF_SIGNED:-true}
      # nl2sql-review and nl2sql-console are in this list because the review
      # service and the SQL console present this same certificate rather
      # than generating one each, and their interfaces' nginx verifies the
      # name it connects to. A name added here is picked up on the API's next
      # start: it reissues a development certificate that does not cover it.
      API_TLS_HOSTNAMES: ${API_TLS_HOSTNAMES:-localhost,nl2sql-api,api,nl2sql-review,review,nl2sql-console,console,127.0.0.1,::1}
      API_TLS_DAYS: ${API_TLS_DAYS:-}
      # --- who may call ----------------------------------------------
      API_TOKEN: ${API_TOKEN:-}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-}
      API_ALLOW_PRINCIPAL: ${API_ALLOW_PRINCIPAL:-}
      # --- work ------------------------------------------------------
      API_MAX_CONCURRENCY: ${API_MAX_CONCURRENCY:-}
      API_JOB_TTL_SECONDS: ${API_JOB_TTL_SECONDS:-}
      API_MAX_JOBS: ${API_MAX_JOBS:-}
      API_MAX_WAIT_SECONDS: ${API_MAX_WAIT_SECONDS:-}
      API_EVENT_STREAM_TIMEOUT_SECONDS: ${API_EVENT_STREAM_TIMEOUT_SECONDS:-}
      API_KEEPALIVE_SECONDS: ${API_KEEPALIVE_SECONDS:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-}
      # --- feedback --------------------------------------------------
      # The only write credential this process holds, and it is INSERT-only
      # on one table: the role cannot read a submission back and cannot see
      # anything a curator has already judged. Unset -- which is what the
      # default gives when the feedback profile is not up -- means the
      # feedback routes answer 503 with a reason and everything else works.
      API_FEEDBACK_DB_URL: ${API_FEEDBACK_DB_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8443}:${API_PORT:-8443}"
    volumes:
      - apitls:/etc/nl2sql/tls
      - ./models/catalog.json:/app/models/catalog.json:ro
    healthcheck:
      # /healthz is the one route that never needs a token, and --insecure is
      # right here and only here: the container is checking its own socket,
      # where the certificate's name and issuer prove nothing.
      test:
        - CMD-SHELL
        - >-
          python -c "import os,ssl,urllib.request;
          p=os.environ.get('API_PORT','8443');
          s='https' if os.environ.get('API_TLS_ENABLED','true').lower() not in ('0','false','no','off') else 'http';
          c=ssl._create_unverified_context();
          urllib.request.urlopen(f'{s}://127.0.0.1:{p}/healthz', context=c, timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    profiles: ["api"]

  # The web interface: a React/TypeScript single page, built to static files
  # and served by nginx, which also proxies the API.
  #
  # The proxy is the reason this is one container rather than two. A browser
  # pointed straight at the API meets a self-signed certificate it will not
  # accept, a token it should not be holding, and a second origin that turns
  # every request into a CORS negotiation. One same-origin hop removes all
  # three -- and none of it is a requirement of the API, which answers a
  # browser directly when API_CORS_ORIGINS names it. See gui/nginx.conf.template.
  gui:
    build:
      context: .
      dockerfile: gui/Dockerfile
    # Both, like the agent service. `setup.sh --gui` pulls the published
    # image and pins these two; without the pin, compose builds it here on
    # first start, which needs no registry and takes a couple of minutes.
    image: ${GUI_IMAGE_NAME:-nl2sql-gui}:${GUI_IMAGE_TAG:-latest}
    container_name: nl2sql-gui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      GUI_PORT: ${GUI_PORT:-8080}
      # nl2sql-api rather than api: both resolve on this network, but the
      # API's generated certificate is issued for that name, and
      # proxy_ssl_name below has to match something it covers.
      API_UPSTREAM: ${GUI_API_UPSTREAM:-https://nl2sql-api:8443}
      API_SSL_NAME: ${GUI_API_SSL_NAME:-nl2sql-api}
      API_CACERT: ${GUI_API_CACERT:-/etc/nl2sql/tls/server.crt}
      # Longer than a question takes, and longer than API_MAX_WAIT_SECONDS
      # can hold a connection, or the proxy cuts the answer off.
      API_READ_TIMEOUT: ${GUI_API_READ_TIMEOUT:-600s}
      # Docker's embedded DNS. The proxy resolves the API per request so it
      # survives the API being restarted onto a new address.
      GUI_RESOLVER: ${GUI_RESOLVER:-127.0.0.11}
      # Held here so the browser never sees it. The GUI sends no token of
      # its own; this is the only place one is added.
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "${GUI_PORT:-8080}:${GUI_PORT:-8080}"
    volumes:
      # Read-only, and only the certificate is read: the proxy verifies the
      # API rather than skipping verification, which is the difference
      # between TLS and a TLS-shaped URL.
      - apitls:/etc/nl2sql/tls:ro
    profiles: ["gui"]

  # The review service: the process that can rewrite the golden question set.
  #
  # Separate from the API because of what it can do, not because of what it
  # is. It writes context_questions/translated_questions.md and reloads the
  # stores built from it -- that is the question set the agent is measured
  # against, and giving those powers to the internet-facing process because
  # both happen to be FastAPI would put the benchmark inside the blast radius
  # of the thing being benchmarked.
  review:
    build:
      context: .
      dockerfile: review/Dockerfile
    image: ${REVIEW_IMAGE_NAME:-nl2sql-review}:${REVIEW_IMAGE_TAG:-latest}
    container_name: nl2sql-review
    restart: unless-stopped
    depends_on:
      feedbackdb:
        condition: service_healthy
      chunkdb:
        condition: service_healthy
      vectordb:
        condition: service_healthy
      # A fix is validated by running it against the retail database, and
      # stored in one of these two.
      postgres:
        condition: service_healthy
      correctionsdb:
        condition: service_healthy
      completionsdb:
        condition: service_healthy
    environment:
      REVIEW_HOST: ${REVIEW_HOST:-0.0.0.0}
      REVIEW_PORT: ${REVIEW_PORT:-8444}
      REVIEW_ROOT_PATH: ${REVIEW_ROOT_PATH:-}
      # Presents the certificate the API generates rather than one of its
      # own; API_TLS_HOSTNAMES above covers nl2sql-review for that reason.
      REVIEW_TLS_ENABLED: ${REVIEW_TLS_ENABLED:-true}
      REVIEW_TLS_CERT_FILE: ${REVIEW_TLS_CERT_FILE:-/etc/nl2sql/tls/server.crt}
      REVIEW_TLS_KEY_FILE: ${REVIEW_TLS_KEY_FILE:-/etc/nl2sql/tls/server.key}
      # Not optional in the way API_TOKEN is. A caller here can edit the
      # golden question set; the readiness endpoint says so loudly when this
      # is unset.
      REVIEW_TOKEN: ${REVIEW_TOKEN:-}
      REVIEW_CORS_ORIGINS: ${REVIEW_CORS_ORIGINS:-}
      # As the owner: this service creates the schema and re-fences the
      # INSERT-only role the API connects as, on every start.
      FEEDBACK_DB_URL: ${REVIEW_FEEDBACK_DB_URL:-postgresql://feedback:feedback@nl2sql-feedbackdb:5432/nl2sql_feedback}
      FEEDBACK_WRITER_PASSWORD: ${FEEDBACK_WRITER_PASSWORD:-nl2sql_feedback_writer}
      REVIEW_MANAGE_SCHEMA: ${REVIEW_MANAGE_SCHEMA:-}
      # --- fixing wrong and incomplete answers ----------------------
      # Validation runs the reviewer's SQL as the read-only role the agent
      # uses, never as the owner: it is SQL a person typed.
      RETAIL_DB_URL: ${REVIEW_RETAIL_DB_URL:-postgresql://nl2sql_reader:nl2sql_reader@nl2sql-postgres:5432/nl2sql_retail}
      REVIEW_VALIDATE_TIMEOUT_MS: ${REVIEW_VALIDATE_TIMEOUT_MS:-}
      REVIEW_VALIDATE_MAX_ROWS: ${REVIEW_VALIDATE_MAX_ROWS:-}
      CORRECTIONS_DB_URL: ${REVIEW_CORRECTIONS_DB_URL:-postgresql://corrections:corrections@nl2sql-correctionsdb:5432/nl2sql_corrections}
      COMPLETIONS_DB_URL: ${REVIEW_COMPLETIONS_DB_URL:-postgresql://completions:completions@nl2sql-completionsdb:5432/nl2sql_completions}
      REVIEW_EMBED_FIXES: ${REVIEW_EMBED_FIXES:-}
      # --- promotion -------------------------------------------------
      REVIEW_DOCUMENT: ${REVIEW_DOCUMENT:-/app/context_questions/translated_questions.md}
      REVIEW_RAG_DIR: ${REVIEW_RAG_DIR:-/app/rag}
      REVIEW_RELOAD_CONTEXT: ${REVIEW_RELOAD_CONTEXT:-}
      REVIEW_RELOAD_VECTORS: ${REVIEW_RELOAD_VECTORS:-}
      REVIEW_RELOAD_TIMEOUT_SECONDS: ${REVIEW_RELOAD_TIMEOUT_SECONDS:-}
      CHUNK_DB_URL: ${REVIEW_CHUNK_DB_URL:-postgresql://ragproc:ragproc@nl2sql-chunkdb:5432/nl2sql_chunks}
      VECTOR_DB_URL: ${REVIEW_VECTOR_DB_URL:-postgresql://ragproc:ragproc@nl2sql-vectordb:5432/nl2sql_vectors}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      REVIEW_DOCS_ENABLED: ${REVIEW_DOCS_ENABLED:-}
      REVIEW_LOG_LEVEL: ${REVIEW_LOG_LEVEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${REVIEW_PORT:-8444}:${REVIEW_PORT:-8444}"
    volumes:
      # Read-only: the certificate the API wrote, which this service presents.
      - apitls:/etc/nl2sql/tls:ro
      # The golden question document, bind-mounted from the working tree.
      #
      # This is the one writable bind mount in the project and it is the
      # whole point of the service: a promotion has to change the file in
      # *this checkout*, so it can be read, reviewed and committed like any
      # other edit. Written into a container's own copy it would vanish with
      # the container, and the golden set would have grown somewhere nobody
      # can see.
      - ./context_questions:/app/context_questions
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,ssl,urllib.request;
          p=os.environ.get('REVIEW_PORT','8444');
          s='https' if os.environ.get('REVIEW_TLS_ENABLED','true').lower() not in ('0','false','no','off') else 'http';
          c=ssl._create_unverified_context();
          urllib.request.urlopen(f'{s}://127.0.0.1:{p}/healthz', context=c, timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    profiles: ["review"]

  # The review interface: a second React/TypeScript single page, built to
  # static files and served by its own nginx, which proxies the review
  # service.
  #
  # A second container and a second npm project rather than a route in the
  # web GUI. Two entry points in one project would share a build, and the
  # public GUI's image would then be serving the interface that rewrites the
  # golden question set to anyone who could reach it.
  reviewgui:
    build:
      context: .
      dockerfile: review/gui/Dockerfile
    image: ${REVIEW_GUI_IMAGE_NAME:-nl2sql-review-gui}:${REVIEW_GUI_IMAGE_TAG:-latest}
    container_name: nl2sql-review-gui
    restart: unless-stopped
    depends_on:
      review:
        condition: service_healthy
    environment:
      REVIEW_GUI_PORT: ${REVIEW_GUI_PORT:-8081}
      # nl2sql-review rather than review: both resolve on this network, but
      # the certificate is issued for that name and proxy_ssl_name has to
      # match something it covers.
      REVIEW_UPSTREAM: ${REVIEW_GUI_UPSTREAM:-https://nl2sql-review:8444}
      REVIEW_SSL_NAME: ${REVIEW_GUI_SSL_NAME:-nl2sql-review}
      REVIEW_CACERT: ${REVIEW_GUI_CACERT:-/etc/nl2sql/tls/server.crt}
      # Longer than a promotion takes: it runs both RAG loaders and re-embeds.
      REVIEW_READ_TIMEOUT: ${REVIEW_GUI_READ_TIMEOUT:-900s}
      REVIEW_GUI_RESOLVER: ${REVIEW_GUI_RESOLVER:-127.0.0.11}
      # Held here so the reviewer's browser never sees it. This token can
      # rewrite the golden question set.
      REVIEW_TOKEN: ${REVIEW_TOKEN:-}
    ports:
      - "${REVIEW_GUI_PORT:-8081}:${REVIEW_GUI_PORT:-8081}"
    volumes:
      - apitls:/etc/nl2sql/tls:ro
    profiles: ["reviewgui"]

  # The SQL console: the retail database as the agent sees it, for working
  # out why an answer was wrong.
  #
  # The same image as the agent and the API, a third way in, because every
  # answer it gives has to be the agent's: the same role (the URL is the
  # agent's own, anchored above), the same statement timeout, row cap and
  # plan-cost ceiling, the same validator and the same introspection. A
  # separate process from the API because of what it does: the API runs SQL
  # the pipeline wrote, and this runs SQL a person typed.
  #
  # Its ports are published on this machine only unless CONSOLE_BIND_ADDRESS
  # says otherwise. Every other port here is open to the network the way
  # Docker opens ports; a page that runs SQL is not one to offer the LAN by
  # default.
  console:
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: ${AGENT_IMAGE_NAME:-nl2sql-agent}:${AGENT_IMAGE_TAG:-latest}
    container_name: nl2sql-console
    restart: unless-stopped
    command: ["python", "-m", "nl2sql_agent.console"]
    entrypoint: []
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- the agent's, and only these -------------------------------
      # What the console reads of the agent's configuration. The pipeline's
      # other settings -- the models, retrieval, the stages -- are nothing
      # to a process that runs no pipeline, so they are not passed.
      DATABASE_URL: *agent-database-url
      DB_SCHEMA: ${DB_SCHEMA:-}
      MAX_ROWS: ${MAX_ROWS:-}
      SAMPLE_ROWS: ${SAMPLE_ROWS:-}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-}
      MAX_PLAN_COST: *agent-max-plan-cost
      # --- the socket ------------------------------------------------
      CONSOLE_HOST: ${CONSOLE_HOST:-0.0.0.0}
      CONSOLE_PORT: ${CONSOLE_PORT:-8445}
      CONSOLE_ROOT_PATH: ${CONSOLE_ROOT_PATH:-}
      # Presents the certificate the API generates, as the review service
      # does; API_TLS_HOSTNAMES above covers nl2sql-console for that reason.
      CONSOLE_TLS_ENABLED: ${CONSOLE_TLS_ENABLED:-true}
      CONSOLE_TLS_CERT_FILE: ${CONSOLE_TLS_CERT_FILE:-/etc/nl2sql/tls/server.crt}
      CONSOLE_TLS_KEY_FILE: ${CONSOLE_TLS_KEY_FILE:-/etc/nl2sql/tls/server.key}
      # --- who may call ----------------------------------------------
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
      CONSOLE_CORS_ORIGINS: ${CONSOLE_CORS_ORIGINS:-}
      # --- what a query may return -----------------------------------
      CONSOLE_MAX_ROWS: ${CONSOLE_MAX_ROWS:-}
      CONSOLE_DOCS_ENABLED: ${CONSOLE_DOCS_ENABLED:-}
      CONSOLE_LOG_LEVEL: ${CONSOLE_LOG_LEVEL:-}
    ports:
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_PORT:-8445}:${CONSOLE_PORT:-8445}"
    volumes:
      # Read-only: the certificate the API wrote, which this process presents.
      - apitls:/etc/nl2sql/tls:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,ssl,urllib.request;
          p=os.environ.get('CONSOLE_PORT','8445');
          s='https' if os.environ.get('CONSOLE_TLS_ENABLED','true').lower() not in ('0','false','no','off') else 'http';
          c=ssl._create_unverified_context();
          urllib.request.urlopen(f'{s}://127.0.0.1:{p}/healthz', context=c, timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 20s
    profiles: ["console"]

  # The console interface: a third React/TypeScript single page, built to
  # static files and served by its own nginx, which proxies the console.
  #
  # Its own container and npm project, like the review interface and for the
  # same reason: an entry point in the public GUI's project would be served
  # by the public GUI's image, to anyone who could reach it.
  consolegui:
    build:
      context: .
      dockerfile: console/Dockerfile
    image: ${CONSOLE_GUI_IMAGE_NAME:-nl2sql-console-gui}:${CONSOLE_GUI_IMAGE_TAG:-latest}
    container_name: nl2sql-console-gui
    restart: unless-stopped
    depends_on:
      console:
        condition: service_healthy
    environment:
      CONSOLE_GUI_PORT: ${CONSOLE_GUI_PORT:-8082}
      # nl2sql-console rather than console: the certificate is issued for
      # that name and proxy_ssl_name has to match something it covers.
      CONSOLE_UPSTREAM: ${CONSOLE_GUI_UPSTREAM:-https://nl2sql-console:8445}
      CONSOLE_SSL_NAME: ${CONSOLE_GUI_SSL_NAME:-nl2sql-console}
      CONSOLE_CACERT: ${CONSOLE_GUI_CACERT:-/etc/nl2sql/tls/server.crt}
      # Longer than the agent's statement timeout, which is the longest a
      # query can take, or the proxy cuts off an answer that is coming.
      CONSOLE_READ_TIMEOUT: ${CONSOLE_GUI_READ_TIMEOUT:-120s}
      CONSOLE_GUI_RESOLVER: ${CONSOLE_GUI_RESOLVER:-127.0.0.11}
      # Held here so the browser never sees it.
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:-}
    ports:
      - "${CONSOLE_BIND_ADDRESS:-127.0.0.1}:${CONSOLE_GUI_PORT:-8082}:${CONSOLE_GUI_PORT:-8082}"
    volumes:
      - apitls:/etc/nl2sql/tls:ro
    profiles: ["consolegui"]

  # The tracking store behind MLflow: experiments, traces and the verdicts on
  # them. Stock Postgres, like feedbackdb and for its reason -- what it holds
  # accumulates from use, not from a build -- labelled and published with the
  # release (docker/mlflowdb/Dockerfile). Its port is not published: nothing
  # reads it but the server below, and a trace holds questions, queries and
  # the rows they returned.
  mlflowdb:
    build:
      context: .
      dockerfile: docker/mlflowdb/Dockerfile
    # Pinned by `setup.sh --mlflow`, like the other images; unpinned, compose
    # builds it here, which is a pull of the Postgres it is.
    image: ${MLFLOW_DB_IMAGE_NAME:-nl2sql-mlflowdb}:${MLFLOW_DB_IMAGE_TAG:-latest}
    container_name: nl2sql-mlflowdb
    restart: unless-stopped
    stop_grace_period: 1m
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER:-mlflow}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow}
      POSTGRES_DB: ${MLFLOW_DB_NAME:-mlflow}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mlflowdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${MLFLOW_DB_USER:-mlflow} -d ${MLFLOW_DB_NAME:-mlflow}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    profiles: ["mlflow"]

  # MLflow: where the agent's traces go -- one per question, a span per agent
  # and per model call -- with the verdicts given on its answers and the
  # benchmark's runs. See agent/nl2sql_agent/tracing.py.
  #
  # MLflow's own published server, in the variant that carries a Postgres
  # driver, built here under the release's tag (docker/mlflow/Dockerfile) and
  # pinned to the version of the agent's tracing client, which a test holds.
  # How it is served is the command below, not the image.
  #
  # Published on this machine only unless MLFLOW_BIND_ADDRESS says otherwise,
  # like the SQL console: the interface has no login, can delete what it
  # shows, and what it shows includes the rows every question returned.
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    image: ${MLFLOW_IMAGE_NAME:-nl2sql-mlflow}:${MLFLOW_IMAGE_TAG:-latest}
    container_name: nl2sql-mlflow
    restart: unless-stopped
    depends_on:
      mlflowdb:
        condition: service_healthy
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=postgresql://${MLFLOW_DB_USER:-mlflow}:${MLFLOW_DB_PASSWORD:-mlflow}@nl2sql-mlflowdb:5432/${MLFLOW_DB_NAME:-mlflow}
      # Artifacts -- a trace's attachments, the benchmark's report -- are
      # uploaded through the server into the volume, so a client needs the
      # server's address and nothing else.
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      # The Host headers the server answers, against DNS rebinding: the
      # agent's names for it on this network, then MLflow's own default --
      # loopback and private addresses, restated exactly, because naming
      # any host replaces that default rather than adding to it.
      - --allowed-hosts=${MLFLOW_ALLOWED_HOSTS:-nl2sql-mlflow,nl2sql-mlflow:*,mlflow,mlflow:*,localhost,127.0.0.1,[::1],0.0.0.0,localhost:*,127.0.0.1:*,[[]::1]:*,0.0.0.0:*,192.168.*,10.*,172.16.*,172.17.*,172.18.*,172.19.*,172.20.*,172.21.*,172.22.*,172.23.*,172.24.*,172.25.*,172.26.*,172.27.*,172.28.*,172.29.*,172.30.*,172.31.*,fc00:*,fd00:*}
      - --workers=${MLFLOW_WORKERS:-2}
    ports:
      # 5001 on the host: macOS keeps 5000 for AirPlay.
      - "${MLFLOW_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflowartifacts:/mlflow/artifacts
    healthcheck:
      # Python, because the image has no curl.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5).read()"
      interval: 10s
      timeout: 8s
      retries: 6
      start_period: 30s
    profiles: ["mlflow"]

  # An outside client. Nothing of this project is installed in it -- it is a
  # curl image on the same network, which is the point: if the API can only
  # be driven by something that imports nl2sql_agent, it is not an API.
  apitest:
    build:
      context: .
      dockerfile: docker/apitest/Dockerfile
    image: ${APITEST_IMAGE_NAME:-nl2sql-apitest}:${APITEST_IMAGE_TAG:-latest}
    container_name: nl2sql-apitest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: ${APITEST_BASE_URL:-https://nl2sql-api:8443}
      API_TOKEN: ${API_TOKEN:-}
      # The development certificate is self-signed, so the smoke test is told
      # so explicitly rather than reaching for --insecure on its own.
      API_INSECURE: ${APITEST_INSECURE:-true}
      API_CACERT: ${APITEST_CACERT:-}
      APITEST_QUESTION: ${APITEST_QUESTION:-How many stores are there?}
      APITEST_WAIT_SECONDS: ${APITEST_WAIT_SECONDS:-240}
    volumes:
      - apitls:/etc/nl2sql/tls:ro
    profiles: ["api"]

  # A build, not a deployment.
  #
  # The desktop client draws a window on somebody's own machine, so nothing
  # runs it in a container. What this service does is produce its jar, which
  # keeps the promise the rest of this file makes: Docker and nothing else.
  # Requiring Maven as well, for one component, would make that false.
  #
  # `docker compose --profile desktop run --rm desktop` builds the jar and
  # copies it into ./desktop/target. `launch.sh --desktop` does exactly that,
  # having first worked out which platform to build for.
  desktop:
    build:
      context: .
      dockerfile: desktop/Dockerfile
      args:
        # The machine the jar is *for*, which is not the one building it.
        # launch.sh reads it from `uname`; the default is what a Linux
        # container would otherwise assume about itself.
        JAVAFX_PLATFORM: ${JAVAFX_PLATFORM:-linux}
    # Tagged by platform: one jar is one platform, and a cached image built
    # for another machine is a jar that will not start on this one. The tag
    # is a version *and* a platform, which is how the published ones are
    # named -- `v5_5-mac-aarch64`. Unpinned it says `local`, which has
    # nowhere to be pulled from and is built here instead.
    image: ${DESKTOP_IMAGE_NAME:-nl2sql-desktop-build}:${DESKTOP_IMAGE_TAG:-local}-${JAVAFX_PLATFORM:-linux}
    volumes:
      - ./desktop/target:/out
    profiles: ["desktop"]

volumes:
  apitls:
    # The REST server's certificate and key. Named so a generated development
    # certificate survives a restart: a client that trusted it once (or
    # pinned its fingerprint) keeps working instead of being asked again on
    # every `docker compose up`.
  pgdata:
    name: nl2sql-pgdata
  feedbackdata:
    # Staged feedback. With the two below, the volumes holding data a person
    # typed rather than data a build produced, which is what makes them the
    # ones worth backing up.
  correctionsdata:
    # Reviewed corrections of wrong answers, and their embeddings.
  completionsdata:
    # Reviewed completions of incomplete answers, and their embeddings.
  mlflowdata:
    # MLflow's tracking store: experiments, runs, traces and their verdicts.
  mlflowartifacts:
    # What MLflow stores beside them: trace attachments, benchmark reports.
  chunkdata:
    # Project-scoped, seeded from the published image on first start -- the
    # same arrangement as vectordata below.
  vectordata:
    # Project-scoped (nl2sql_vectordata). The image ships the embeddings, so
    # a fresh volume is seeded from it on first start -- no need to adopt the
    # volume the RAG pipeline created under a different compose project, which
    # only earned a warning on every compose command.
