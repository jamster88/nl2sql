# nginx's main configuration for the proxy image.
#
# The stock one with three changes. No `user` directive: the master runs as
# nginx's account already (USER 101) and could not switch to it. The pid,
# the temporary files and the server blocks are under /tmp, which compose
# mounts as a tmpfs in a container whose root is read-only (V6-34). And the
# only server block is the one page the start-up script rendered there.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;
    fastcgi_temp_path /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path /tmp/nginx/uwsgi_temp;
    scgi_temp_path /tmp/nginx/scgi_temp;

    # What the browser used, as the page should tell what is behind it
    # (V6-56). nginx's own `$scheme` is `http` behind something that
    # terminates TLS in front of the page, and a session cookie set from that
    # is set without `Secure`. So a terminator's `X-Forwarded-Proto: https` is
    # believed -- upward only: a client that claims https over http gets a
    # cookie its browser will not send back over http, which costs only that
    # client, and nothing here ever trusts a claim of `http`.
    map $http_x_forwarded_proto $nl2sql_forwarded_proto {
        default $scheme;
        https   https;
    }

    include /tmp/nginx/conf.d/*.conf;
}
