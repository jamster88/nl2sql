# What the container's health check asks (nl2sql-proxy-health): answered by
# nginx itself, over the page's own listener, so a passing check means the
# page is serving and its certificate verifies. Under a name of its own --
# `/healthz` on a page is its service's, through the proxy.
location = /_proxy/health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}
