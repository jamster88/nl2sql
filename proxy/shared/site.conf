# What every page serves of its own: the built bundle, compressed, cached as
# long as its names allow, and the page itself for any path that is not a
# file. Included in each page's server block (not MLflow's front door).

index index.html;

# Compressing the bundle is most of the transfer saved. It is off for the
# upstream locations, where it would buffer an event stream.
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

# The hashed asset names are content addresses, so they can be cached for
# ever; index.html never can, or a deploy is invisible until the browser
# decides otherwise.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

# One page, so any path that is not a file is still the page.
location / {
    try_files $uri $uri/ /index.html;
}
