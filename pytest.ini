[pytest]
testpaths = tests
markers =
    docker: needs a working Docker daemon/CLI and may build or run real containers or connect to a live service (opt in with --run-docker)
    node: needs npm and the GUI's installed dependencies; runs the GUI's own test suite (opt in with --run-node)
    java: needs Maven and a JDK of 21 or later; runs the desktop client's own test suite (opt in with --run-java)
    acceptance: builds every image, starts the whole stack with setup.sh and start.sh beside any other, and uses every page (opt in with --run-acceptance)
addopts = -ra
filterwarnings =
    # ldap3 2.9.1, its latest release, imports two names pyasn1 has since
    # renamed. Harmless, not this repository's to fix, and noise that would
    # bury a warning that is.
    ignore:tagMap is deprecated:DeprecationWarning
    ignore:typeMap is deprecated:DeprecationWarning
